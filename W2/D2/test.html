<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">

  <!-- Outer Card -->
  <div class="bg-white p-6 rounded-lg shadow m-6 max-w-xl">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold tracking-wide text-gray-800">
        Notification Center
      </h2>

      <span class="items-center bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-bold">
        3 New
      </span>
    </div>

    <!-- Alerts Section -->
    <div class="mb-6">

      <!-- Alert 1: Error -->
      <div class="bg-red-100 border-l-4 border-red-500 p-4 rounded mb-4">
        <p class="font-bold text-red-800 mb-1">
          Action Required
        </p>
        <p class="text-red-700 ">
          Your last payment attempt failed. Please update your payment method to avoid service interruption.
        </p>
      </div>

      <!-- Alert 2: Info / Neutral -->
      <div class="bg-yellow-100 border-l-4 border-yellow-500 p-4 rounded">
        <p class="font-bold text-yellow-800 mb-1">
          Maintenance Notice
        </p>
        <p class="text-yellow-700 ">
          The system will undergo maintenance tonight. Some features may be temporarily unavailable.
        </p>
      </div>

    </div>

    <!-- Footer Buttons -->
    <div class="flex gap-4">

      <!-- Primary Button -->
      <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg shadow font-bold">
        View All
      </button>

      <!-- Secondary Button -->
      <button class="border border-gray-400 text-gray-700 px-6 py-3 rounded-lg font-bold hover:bg-gray-100">
        Dismiss
      </button>

    </div>

  </div>

</body>



</html>
