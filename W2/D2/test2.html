<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">

  <!-- Metric Snapshot Strip -->
  <div class="bg-white p-6 rounded-lg shadow m-6">

    <!-- Top Row: Metrics + Action -->
    <div class="flex items-start justify-between">

      <!-- Metrics -->
      <div class="flex gap-10">

        <!-- Metric 1 -->
        <div>
          <p class="text-gray-600 ">Active Users</p>
          <p class="text-xl font-bold text-gray-800 mt-1">12,480</p>
          <span class="inline-flex items-center bg-green-100 text-green-800 px-3 py-1 rounded-full font-bold mt-2">
            Up
          </span>
        </div>

        <!-- Metric 2 -->
        <div>
          <p class="text-gray-600">Requests / Min</p>
          <p class="text-xl font-bold text-gray-800 mt-1">1,240</p>
          <span class="inline-flex items-center bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-bold mt-2">
            Stable
          </span>
        </div>

        <!-- Metric 3 -->
        <div>
          <p class="text-gray-600">Error Rate</p>
          <p class="text-xl font-bold text-gray-800 mt-1">2.1%</p>
          <span class="inline-flex items-center bg-red-100 text-red-800 px-3 py-1 rounded-full font-bold mt-2">
            Down
          </span>
        </div>

      </div>

      <!-- Primary Action Button -->
      <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg shadow font-bold">
        Download Report
      </button>

    </div>

    <!-- Inline Alert Bar -->
    <div class="bg-red-100 border-l-4 border-red-500 p-3 rounded mt-6">
      <p class="text-red-700 ">
        Scheduled maintenance tonight may briefly affect dashboard updates.
      </p>
    </div>

  </div>

</body>



</html>
